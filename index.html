<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Sweety ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background: linear-gradient(135deg,#ff758c,#ff7eb3);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* Slides */
.container{
  width:100%;
  height:100vh;
  position:relative;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.1);
  transition: transform 0.6s ease, opacity 0.6s ease;
  opacity:0;
  transform: translateX(100%);
}

.slide.active{
  opacity:1;
  transform: translateX(0);
}

h1{
  font-size:26px;
  margin-bottom:15px;
  animation: fadeIn 1.5s ease;
}

p{
  font-size:18px;
  margin-bottom:20px;
}

img{
  width:160px;
  height:160px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
  margin-bottom:20px;
}

/* Buttons */
button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  margin:8px;
  transition:0.3s;
}

.yes{
  background:white;
  color:#ff4b5c;
}

.no{
  background:#ff4b5c;
  color:white;
  position:absolute;
}

button:active{
  transform:scale(0.95);
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  animation: floatUp 4s linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(0); opacity:1;}
  100%{transform:translateY(-100vh); opacity:0;}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

</style>
</head>
<body>

<div class="container">

<!-- Slide 1 -->
<div class="slide active">
  <h1>Hey My Sweety ❤️</h1>
  <img src="sweety.jpg" alt="Sweety">
  <p>You are the best part of my life 💕</p>
  <button onclick="nextSlide()">Tap to Continue 💌</button>
</div>

<!-- Slide 2 -->
<div class="slide">
  <h1>My Sweetest Sweety 😘</h1>
  <p id="typing"></p>
  <button onclick="nextSlide()">One Last Thing 💖</button>
</div>

<!-- Slide 3 -->
<div class="slide">
  <h1>Sweety, Will You Be Mine Forever? 💍❤️</h1>
  <button class="yes" onclick="yesClick()">Yes 💕</button>
  <button class="no" id="noBtn" ontouchstart="moveNo()">No 😜</button>
</div>

</div>

<script>
let current=0;
const slides=document.querySelectorAll(".slide");

function nextSlide(){
  slides[current].classList.remove("active");
  current++;
  if(current<slides.length){
    slides[current].classList.add("active");
  }
}

/* Typing Effect */
const text="Sweety, you make my world brighter every single day. I promise to stay with you, support you and love you forever ❤️";
let i=0;
function typing(){
  if(i<text.length){
    document.getElementById("typing").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typing,40);
  }
}
typing();

/* Move No Button (Mobile Friendly) */
function moveNo(){
  const btn=document.getElementById("noBtn");
  btn.style.top=Math.random()*80+"vh";
  btn.style.left=Math.random()*80+"vw";
}

/* Yes Celebration */
function yesClick(){
  alert("Yayyy ❤️ Sweety is mine forever Love you Bohot Sara 💑✨");
}

/* Floating Hearts Optimized */
setInterval(()=>{
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),4000);
},600);

</script>

</body>
</html>
